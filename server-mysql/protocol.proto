// opcode 20173
message M2C_GetMarket {
    float Discount = 1;
    int32 RpcId = 90;
    int32 Error = 91;
    string Message = 92;
    // 服务端当前生效的元宝/代金券价格。客户端没有该字段时会自动忽略，
    // 因此旧客户端仍可连接；新客户端应优先使用这里的价格。
    repeated ShopItemPrice ItemPrices = 3;
    // 兼容旧版 ProtoBuf-net 客户端的紧凑价格数组：元宝/代金券交替排列。
    repeated int32 PriceList = 6;
    // 与 PriceList/MarketIdList 同顺序的服务端物品说明。
    repeated string DescriptionList = 7;
}

// ShopItemPrice 是三类商店统一的服务端目录项。
// StoreType: 1=元宝商城，2=普通商店，3=杂货铺/多商店。
// PageOrType: Market/Shop 为页码，MultiShop 为商店 Type。
// SlotIndex 是过滤下架商品后的实际槽位，购买请求必须使用它。
message ShopItemPrice {
    int32 StoreType = 1;
    int32 ConfigId = 2;
    int32 PageOrType = 3;
    int32 SlotIndex = 4;
    int32 ItemId = 5;
    int64 Price = 6;
    int64 VoucherPrice = 7;
    bool Enabled = 8;
    // GoodsBase/EquipBase/MaterialBase 中当前热加载的说明。
    string Description = 9;
}

