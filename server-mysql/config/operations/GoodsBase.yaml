# 该文件必须保留完整 [id, object] 表，发布会整表替换。
# 魔法球 Capacity：110327/110329=100万，110328/110330=500万，
# 110809/110811=1000万，110810/110812=2000万，110832/110834=4000万，110833/110835=8亿。
# 关键字段：Capacity 是魔法球可储存的血/蓝；ContinuedSeconds 是持续时间（秒）。
# Name/Description 只影响客户端文字；服务端购买与回血以发布到 MySQL 的数值为准。
