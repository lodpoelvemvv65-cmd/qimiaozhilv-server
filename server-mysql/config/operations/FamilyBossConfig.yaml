# 家族 BOSS 贡献热更表（配置名：FamilyBossConfig）。
# Contribute / PersonalContribute 无论胜负都会结算给每位实际参战成员。
# 全局额外道具概率和宝石/形象池在 Gameplay.yaml 的 family_boss 中配置。
# 如需某一阶单独覆盖，可增加 BonusDropChance、BonusSkinShare（0..100）。
# 字段提示：Contribute/PersonalContribute 是贡献奖励；Dropasubset 是掉落子集 ID。
# 各阶开场战斗属性倍率 = Gameplay.family_boss.attribute_base_multiplier + CharacterAdd。
# 修改后发布本 YAML，在线玩家会在下一次配置推送后看到新规则。
